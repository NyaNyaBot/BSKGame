version: 1
last_updated: 2026-04-29
source: /ccgs-architecture-review
requirements:
  - id: TR-concept-001
    system: game-concept
    gdd: design/gdd/game-concept.md
    domain: Combat
    status: active
    requirement: 支持“回合制 RPG + 敌方攻击中嵌入实时弹反”的核心循环
  - id: TR-concept-002
    system: game-concept
    gdd: design/gdd/game-concept.md
    domain: Presentation
    status: active
    requirement: 表现层必须放大精准操作的快感，但不得成为规则事实来源
  - id: TR-char-001
    system: 角色数据模型
    gdd: design/gdd/角色数据模型.md
    domain: State
    status: active
    requirement: 所有跨系统角色引用使用稳定 gameplay id
  - id: TR-char-002
    system: 角色数据模型
    gdd: design/gdd/角色数据模型.md
    domain: State
    status: active
    requirement: 区分静态定义、运行时实例和不可变快照
  - id: TR-char-003
    system: 角色数据模型
    gdd: design/gdd/角色数据模型.md
    domain: Combat
    status: active
    requirement: 提供 CanAct、CanBeTargeted、CanReceiveDamage、IsControllable 等独立查询标记
  - id: TR-char-004
    system: 角色数据模型
    gdd: design/gdd/角色数据模型.md
    domain: State
    status: active
    requirement: 角色被击败后保留实例，直到战斗或场景清理显式移除
  - id: TR-input-001
    system: 输入系统
    gdd: design/gdd/输入系统.md
    domain: Input
    status: active
    requirement: 战斗输入来自 Touch / PointerDown，不使用 UGUI click 合成事件做判定源
  - id: TR-input-002
    system: 输入系统
    gdd: design/gdd/输入系统.md
    domain: Input
    status: active
    requirement: 输出结构化 ParryAttempt，并携带时间戳诊断信息
  - id: TR-input-003
    system: 输入系统
    gdd: design/gdd/输入系统.md
    domain: Timing
    status: active
    requirement: 将平台时间戳映射到 CombatClockMs，并标记 fallback 来源
  - id: TR-input-004
    system: 输入系统
    gdd: design/gdd/输入系统.md
    domain: Input
    status: active
    requirement: 拥有触区注册、优先级、遮挡和重复输入过滤
  - id: TR-scene-001
    system: 场景管理
    gdd: design/gdd/场景管理.md
    domain: State
    status: active
    requirement: 拥有 SceneContext、sceneContextId 和 sceneVersion
  - id: TR-scene-002
    system: 场景管理
    gdd: design/gdd/场景管理.md
    domain: Events
    status: active
    requirement: 场景切换期间冻结战斗输入并拒绝迟到事件
  - id: TR-scene-003
    system: 场景管理
    gdd: design/gdd/场景管理.md
    domain: State
    status: active
    requirement: 在战斗场景生命周期内创建和销毁战斗临时运行态
  - id: TR-turn-001
    system: 回合管理器
    gdd: design/gdd/回合管理器.md
    domain: Timing
    status: active
    requirement: 拥有 CombatClockMs 和战斗阶段状态
  - id: TR-turn-002
    system: 回合管理器
    gdd: design/gdd/回合管理器.md
    domain: Input
    status: active
    requirement: 发布显式 BattleInputPhaseChanged 事件
  - id: TR-turn-003
    system: 回合管理器
    gdd: design/gdd/回合管理器.md
    domain: Combat
    status: active
    requirement: 调度敌方攻击段并分配时间轴序列身份
  - id: TR-turn-004
    system: 回合管理器
    gdd: design/gdd/回合管理器.md
    domain: Combat
    status: active
    requirement: 将 CounterWindow 作为一等战斗状态
  - id: TR-turn-005
    system: 回合管理器
    gdd: design/gdd/回合管理器.md
    domain: Combat
    status: active
    requirement: 只读取角色生命状态判定胜负，绝不写 HP
  - id: TR-dmg-001
    system: 伤害与生命系统
    gdd: design/gdd/伤害与生命系统.md
    domain: State
    status: active
    requirement: 作为唯一 HP 写入口
  - id: TR-dmg-002
    system: 伤害与生命系统
    gdd: design/gdd/伤害与生命系统.md
    domain: Combat
    status: active
    requirement: 消费具备幂等键的 DamageRequest
  - id: TR-dmg-003
    system: 伤害与生命系统
    gdd: design/gdd/伤害与生命系统.md
    domain: Combat
    status: active
    requirement: 精确应用弹反 damageMultiplier
  - id: TR-dmg-004
    system: 伤害与生命系统
    gdd: design/gdd/伤害与生命系统.md
    domain: Events
    status: active
    requirement: 发出 DamageApplied、DamageRejected 和 CharacterDefeated
  - id: TR-parry-001
    system: 实时弹反系统
    gdd: design/gdd/实时弹反系统.md
    domain: Timing
    status: active
    requirement: 从 AttackSegmentTimelineSeed 派生并冻结弹反窗口
  - id: TR-parry-002
    system: 实时弹反系统
    gdd: design/gdd/实时弹反系统.md
    domain: Timing
    status: active
    requirement: 用 CombatClockMs 而不是 Unity 帧时间结算 ParryAttempt
  - id: TR-parry-003
    system: 实时弹反系统
    gdd: design/gdd/实时弹反系统.md
    domain: Events
    status: active
    requirement: 发出 ParryResolved、ParryCancelled、OverlapRejected 和时间轴拒绝事件
  - id: TR-parry-004
    system: 实时弹反系统
    gdd: design/gdd/实时弹反系统.md
    domain: Combat
    status: active
    requirement: 只由 PerfectParry 打开 counter，且不直接写 HP
  - id: TR-enemy-001
    system: 敌人 AI 与攻击模式
    gdd: design/gdd/敌人 AI 与攻击模式.md
    domain: Combat AI
    status: active
    requirement: 按权重、冷却、HP 阶段和目标合法性选择脚本化攻击模式
  - id: TR-enemy-002
    system: 敌人 AI 与攻击模式
    gdd: design/gdd/敌人 AI 与攻击模式.md
    domain: Combat
    status: active
    requirement: 拥有基础伤害、读招时序、连击规则等攻击内容事实
  - id: TR-enemy-003
    system: 敌人 AI 与攻击模式
    gdd: design/gdd/敌人 AI 与攻击模式.md
    domain: Events
    status: active
    requirement: 响应弹反、取消、重叠和 counter 事件，不得把被拒绝攻击转为必中
  - id: TR-action-001
    system: 技能与行动系统
    gdd: design/gdd/技能与行动系统.md
    domain: Combat Actions
    status: active
    requirement: MVP 只支持 BasicAttackAction 和 CounterAction
  - id: TR-action-002
    system: 技能与行动系统
    gdd: design/gdd/技能与行动系统.md
    domain: Combat Actions
    status: active
    requirement: 通过 DamageRequest 提交伤害，并保持行动请求幂等
  - id: TR-action-003
    system: 技能与行动系统
    gdd: design/gdd/技能与行动系统.md
    domain: Combat Actions
    status: active
    requirement: 只有收到 CounterEntryOpened 授权后才能执行 counter
  - id: TR-fx-001
    system: 战斗反馈系统
    gdd: design/gdd/战斗反馈系统.md
    domain: Presentation
    status: active
    requirement: 只消费事件，绝不修改战斗事实
  - id: TR-fx-002
    system: 战斗反馈系统
    gdd: design/gdd/战斗反馈系统.md
    domain: Timing
    status: active
    requirement: 发起 hit stop 请求，由回合管理器控制 CombatClockMs
  - id: TR-fx-003
    system: 战斗反馈系统
    gdd: design/gdd/战斗反馈系统.md
    domain: Platform
    status: active
    requirement: VFX 和震动可按性能等级降级，但不得改变结果
  - id: TR-ui-001
    system: 战斗 UI
    gdd: design/gdd/战斗 UI.md
    domain: UI
    status: active
    requirement: 从事件和快照渲染状态，不直接读取可变玩法对象
  - id: TR-ui-002
    system: 战斗 UI
    gdd: design/gdd/战斗 UI.md
    domain: Input
    status: active
    requirement: 通过输入系统注册触区，counter 优先级高于 parry
  - id: TR-ui-003
    system: 战斗 UI
    gdd: design/gdd/战斗 UI.md
    domain: UI
    status: active
    requirement: 不显示精确弹反倒计时；时机可读性来自敌人与反馈 cue
